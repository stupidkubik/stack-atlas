name: Daily metrics collection

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target GitHub Environment and matching PkgCompass target
        required: true
        type: choice
        options:
          - development

permissions:
  contents: read

concurrency:
  group: collector-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  collect-metrics:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/work/foundation-first-pass' && inputs.environment == 'development' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    env:
      APP_ENV: ${{ inputs.environment }}
      DATABASE_IMPORT_URL: ${{ secrets.DATABASE_IMPORT_URL }}
      IMPORT_INVALIDATION_SECRET: ${{ secrets.IMPORT_INVALIDATION_SECRET }}
      GITHUB_API_TOKEN: ${{ secrets.GITHUB_API_TOKEN }}
      SITE_URL: ${{ vars.SITE_URL }}
      SANITY_PROJECT_ID: ${{ vars.SANITY_PROJECT_ID }}
      SANITY_DATASET: ${{ inputs.environment }}
      SANITY_API_VERSION: ${{ vars.SANITY_API_VERSION }}
    steps:
      - name: Check out the dispatched revision
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up the project's Node version
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0

      - name: Install the pinned npm version
        run: npm install --global npm@12.0.2

      - name: Install locked dependencies
        run: npm ci

      - name: Collect metrics
        env:
          VERCEL_OIDC_TOKEN: ${{ secrets.VERCEL_OIDC_TOKEN }}
        run: >-
          npm run collect -- --env "${{ inputs.environment }}" --apply
          --report-path "$RUNNER_TEMP/metrics-report.json"

      - name: Retain the sanitized collector report for 14 days
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: metrics-${{ inputs.environment }}-${{ github.run_id }}
          path: ${{ runner.temp }}/metrics-report.json
          if-no-files-found: ignore
          retention-days: 14
